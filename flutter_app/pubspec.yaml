name: boodschappen_app
description: "Boodschappen - Dutch grocery shopping list app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.8.1
  cloud_firestore: ^5.5.1

  # Barcode scanning
  mobile_scanner: ^6.0.3

  # Network images with cache
  cached_network_image: ^3.4.1

  # HTTP requests
  http: ^1.2.2

  # Shared preferences
  shared_preferences: ^2.3.4

  # UUID generation
  uuid: ^4.5.1

  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
