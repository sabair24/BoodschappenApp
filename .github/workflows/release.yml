name: 🚀 Build & Release

on:
  push:
    tags:
      - 'v*'   # triggert bij: git tag v1.5 && git push origin v1.5
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Versienaam (leeg = automatisch uit build.gradle.kts)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # vereist voor aanmaken van GitHub Releases

    steps:
      # ── 1. Code ophalen ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # alle geschiedenis + tags ophalen

      # ── 2. JDK 17 instellen ───────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Versienaam bepalen ────────────────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            VER="${{ github.event.inputs.version_override }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(grep 'versionName' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"' | head -1)
          fi
          CODE=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+' | head -1)
          echo "name=$VER" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT

      # ── 4. Tag aanmaken als die nog niet bestaat (workflow_dispatch) ──────────
      - name: Create git tag if missing
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG bestaat al, wordt overgeslagen"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tag $TAG aangemaakt en gepusht"
          fi

      # ── 5. APK bouwen ─────────────────────────────────────────────────────────
      - name: Build release APK
        run: ./gradlew assembleRelease

      # ── 6. APK pad opslaan ────────────────────────────────────────────────────
      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK)" >> $GITHUB_OUTPUT

      # ── 7. GitHub Release aanmaken + APK uploaden ─────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.name }}"
          name: "v${{ steps.version.outputs.name }}"
          body: |
            ## 📦 Boodschappenlijst App v${{ steps.version.outputs.name }}

            Download de APK hieronder en installeer hem op je Android telefoon.
            De app meldt zelf ook als er een update beschikbaar is.
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 8. Firestore bijwerken ────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Update Firestore version info
        run: node scripts/update_firestore_ci.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
